services:
  motorsportdb:
    container_name: motorsportdb
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - "10001:80"
    volumes:
      - .:/var/www/html
    # Ensure driverdle.json is writable by www-data (the PHP process user)
    # and that the (gitignored) games/guess-who session directory exists
    # and is writable, so a fresh checkout doesn't break the guess-who game.
    command: >
      sh -c "touch /var/www/html/driverdle.json &&
             chmod 666 /var/www/html/driverdle.json &&
             mkdir -p /var/www/html/games/guess-who &&
             chmod -R 777 /var/www/html/games &&
             exec apache2-foreground"
    restart: unless-stopped
