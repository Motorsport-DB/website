ServerTokens Prod
ServerSignature Off
TraceEnable Off

<VirtualHost *:80>
    DocumentRoot /var/www/html

    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        # All rules live here: .htaccess files are ignored (faster, and a
        # stray .htaccess in a data repository cannot change the config).
        AllowOverride None
        Require all granted

        RewriteEngine On
        RewriteBase /

        # Versioned scripts and styles (includes/assets.php): /assets/v<version>/js/… = /assets/js/…
        RewriteRule ^assets/v[0-9a-f]+/((?:js|css)/.+)$ assets/$1 [END]

        # Never served: sources, tooling, generated data, VCS metadata
        RewriteRule ^(\.git|\.github|bin|docker|includes|node_modules|script|src|tests|var)(/|$) - [F,L]
        RewriteRule (^|/)\.git(/|$) - [F,L]
        RewriteRule ^(router|sitemap-serve)\.php$ - [F,L]
        # Only pictures and JSON data are public in the data repositories
        RewriteRule ^(drivers|teams|races)/(?!picture/).*(?<!\.json)$ - [F,L]

        RewriteRule ^sitemap\.xml$ sitemap-serve.php [END]

        # Old API names
        RewriteRule ^getDrivers\.php$ api/drivers.php [L,QSA]
        RewriteRule ^getDriversList\.php$ api/drivers-list.php [L,QSA]
        RewriteRule ^getTeams\.php$ api/teams.php [L,QSA]
        RewriteRule ^getTeamsList\.php$ api/teams-list.php [L,QSA]
        RewriteRule ^getRaces\.php$ api/races.php [L,QSA]
        RewriteRule ^getMainPage\.php$ api/search.php [L,QSA]

        # Old HTML pages
        RewriteRule ^index\.html$ / [L,R=301]
        RewriteRule ^(driver|team|race|head-to-head)\.html$ /$1.php [L,R=301,QSA]
        RewriteRule ^(guess-who|driverdle)\.html$ /games/$1.php [L,R=301]

        # Pages
        RewriteRule ^(driver|team|race|head-to-head|ranking)\.php$ public/$1.php [END,QSA]
        RewriteRule ^games/(guess-who|driverdle|driverdle-f1|driverdle-all|driverdle-classic)\.php$ public/games/$1.php [END,QSA]
        RewriteRule ^$ public/index.php [END]

        # Clean URLs
        RewriteRule ^(driver|team|race|head-to-head|ranking)$ /$1.php [R=301,L,QSA]
        RewriteRule ^games/(guess-who|driverdle|driverdle-f1|driverdle-all|driverdle-classic)$ /games/$1.php [R=301,L,QSA]
    </Directory>

    <FilesMatch "(^\.|docker-compose[\w.-]*\.ya?ml$|config\.json$|tailwind\.config\.js$|README\.md$|composer\.(json|lock)$|package(-lock)?\.json$|\.(sqlite|py|sh|md|txt|log|bak|tmp)$)">
        Require all denied
    </FilesMatch>
    <Files "robots.txt">
        Require all granted
    </Files>

    <IfModule mod_headers.c>
        Header always set X-Frame-Options "SAMEORIGIN"
        Header always set X-Content-Type-Options "nosniff"
        Header always set Referrer-Policy "strict-origin-when-cross-origin"
        Header always set Permissions-Policy "camera=(), microphone=(), geolocation=()"
        Header always set Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'"
    </IfModule>

    <IfModule mod_deflate.c>
        AddOutputFilterByType DEFLATE text/html text/plain text/xml text/css text/javascript application/javascript application/json application/xml image/svg+xml
    </IfModule>

    <IfModule mod_expires.c>
        ExpiresActive On
        ExpiresByType image/jpeg "access plus 1 month"
        ExpiresByType image/png "access plus 1 month"
        ExpiresByType image/webp "access plus 1 month"
        ExpiresByType image/svg+xml "access plus 1 month"
        # scripts and styles are not versioned (no ?v= in the URLs): the browser revalidates
        # them (304 while unchanged) so a fix reaches the visitors at once
        ExpiresByType text/css "access plus 0 seconds"
        ExpiresByType text/javascript "access plus 0 seconds"
        ExpiresByType application/javascript "access plus 0 seconds"
    </IfModule>
    <IfModule mod_headers.c>
        # a versioned URL never changes content: kept for a year, never revalidated
        <If "%{THE_REQUEST} =~ m#\s/assets/v[0-9a-f]+/#">
            Header set Cache-Control "public, max-age=31536000, immutable"
            Header unset Expires
        </If>
    </IfModule>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
