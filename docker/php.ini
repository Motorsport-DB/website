; MotorsportDB hardening (loaded after php.ini-production)
expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /proc/self/fd/2

; PHP2Shell defence in depth: the site uses neither uploads nor sessions
file_uploads = Off
session.upload_progress.enabled = 0
fatal_error_backtraces = 0

allow_url_fopen = Off
allow_url_include = Off
memory_limit = 256M
max_execution_time = 30
post_max_size = 64K
max_input_vars = 200
disable_functions = exec,passthru,shell_exec,system,proc_open,popen,pcntl_exec,dl
open_basedir = /var/www/html:/var/lib/motorsportdb:/tmp

apc.enabled = 1
apc.shm_size = 64M
apc.ttl = 86400
